body{background:#ffeef2;font-family:sans-serif;text-align:center}
.page{display:none;min-height:100vh;padding:70px 20px 30px;flex-direction:column;align-items:center;justify-content:center}
.page.active{display:flex}

.nav span.active{background:#8b1e3a;color:#fff}
h1{font-family:serif;font-size:32px;color:#3a1220}
.sub{font-size:13px;opacity:.7;margin:10px 0}
.btn{background:#8b1e3a;color:#fff;border:none;padding:12px 28px;border-radius:30px;margin-top:20px;cursor:pointer}
